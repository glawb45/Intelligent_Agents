<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bon Voyage — AI Trip Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:    #f5f0e8;
      --parchment:#ede5d4;
      --sand:     #d4c4a8;
      --ink:      #1c1810;
      --ink-soft: #3d3428;
      --rust:     #8b3a1e;
      --rust-light:#c4602e;
      --forest:   #2d4a3e;
      --gold:     #b8860b;
      --gold-light:#d4a520;
      --serif:    'Cormorant Garamond', Georgia, serif;
      --mono:     'DM Mono', monospace;
      --sans:     'Jost', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      overflow: hidden;
    }

    /* Grain texture overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 1000; opacity: 0.4;
    }

    /* ── Layout ── */
    .app {
      display: grid;
      grid-template-columns: 380px 1fr;
      grid-template-rows: 64px 1fr;
      height: 100vh;
    }

    /* ── Header ── */
    header {
      grid-column: 1 / -1;
      background: var(--ink);
      display: flex;
      align-items: center;
      padding: 0 32px;
      gap: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .logo {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 400;
      color: var(--cream);
      letter-spacing: 0.04em;
    }

    .logo span {
      color: var(--gold-light);
      font-style: italic;
    }

    .tagline {
      font-family: var(--mono);
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-left: auto;
    }

    /* ── Left Panel ── */
    .panel-left {
      background: var(--parchment);
      border-right: 1px solid var(--sand);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-heading {
      padding: 28px 28px 16px;
      border-bottom: 1px solid var(--sand);
    }

    .panel-heading h2 {
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 300;
      color: var(--ink);
      line-height: 1.2;
    }

    .panel-heading p {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 6px;
      line-height: 1.5;
      opacity: 0.7;
    }

    /* Quick examples */
    .examples {
      padding: 16px 28px;
      border-bottom: 1px solid var(--sand);
    }

    .examples-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--rust);
      margin-bottom: 10px;
    }

    .example-chip {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 1px solid var(--sand);
      border-radius: 4px;
      padding: 8px 12px;
      font-family: var(--sans);
      font-size: 12px;
      color: var(--ink-soft);
      cursor: pointer;
      margin-bottom: 6px;
      transition: all 0.2s;
      line-height: 1.4;
    }

    .example-chip:hover {
      background: var(--cream);
      border-color: var(--rust);
      color: var(--rust);
    }

    /* Input area */
    .input-area {
      padding: 20px 28px;
      margin-top: auto;
      border-top: 1px solid var(--sand);
    }

    .input-area label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--rust);
      display: block;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      background: var(--cream);
      border: 1px solid var(--sand);
      border-radius: 6px;
      padding: 12px 14px;
      font-family: var(--sans);
      font-size: 13px;
      color: var(--ink);
      resize: none;
      outline: none;
      line-height: 1.6;
      min-height: 110px;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: var(--rust); }
    textarea::placeholder { color: rgba(28,24,16,0.3); }

    .btn-plan {
      width: 100%;
      margin-top: 10px;
      background: var(--rust);
      color: var(--cream);
      border: none;
      border-radius: 6px;
      padding: 13px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-plan:hover:not(:disabled) { background: var(--rust-light); }
    .btn-plan:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Activity log */
    .activity-log {
      flex: 1;
      overflow-y: auto;
      padding: 16px 28px;
    }

    .activity-log-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--rust);
      margin-bottom: 12px;
    }

    .log-entry {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .log-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }
    .log-dot.calling  { background: var(--gold); }
    .log-dot.done     { background: var(--forest); }
    .log-dot.error    { background: var(--rust); }
    .log-dot.info     { background: var(--sand); }

    .log-text {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-soft);
      line-height: 1.5;
    }

    /* Tool name badge */
    .tool-badge {
      display: inline-block;
      background: var(--ink);
      color: var(--gold-light);
      font-family: var(--mono);
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      margin-right: 4px;
    }

    /* ── Right Panel ── */
    .panel-right {
      overflow-y: auto;
      padding: 40px 52px;
      background: var(--cream);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      opacity: 0.4;
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .empty-state h3 {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 300;
    }

    .empty-state p {
      font-size: 13px;
      margin-top: 8px;
      max-width: 300px;
    }

    /* Loading spinner */
    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
    }

    .spinner {
      width: 40px; height: 40px;
      border: 2px solid var(--sand);
      border-top-color: var(--rust);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--ink-soft);
      opacity: 0.6;
    }

    /* Itinerary output */
    .itinerary {
      max-width: 760px;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .itinerary h1 {
      font-family: var(--serif);
      font-size: 46px;
      font-weight: 300;
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .itinerary-meta {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--rust);
      text-transform: uppercase;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--sand);
    }

    .itinerary-body {
      font-size: 15px;
      line-height: 1.85;
      color: var(--ink-soft);
    }

    .itinerary-body h2 {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 400;
      color: var(--ink);
      margin: 36px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--sand);
    }

    .itinerary-body h3 {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 600;
      color: var(--rust);
      margin: 24px 0 8px;
    }

    .itinerary-body strong {
      color: var(--ink);
      font-weight: 500;
    }

    .itinerary-body ul, .itinerary-body ol {
      padding-left: 20px;
      margin: 8px 0;
    }

    .itinerary-body li { margin: 4px 0; }

    .itinerary-body p { margin: 8px 0; }

    /* Stats strip */
    .stats-strip {
      display: flex;
      gap: 32px;
      background: var(--parchment);
      border: 1px solid var(--sand);
      border-radius: 8px;
      padding: 16px 24px;
      margin-bottom: 32px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-value {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 400;
      color: var(--ink);
    }

    .stat-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--rust);
    }

    /* Error banner */
    .error-banner {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 6px;
      padding: 16px 20px;
      color: #7f1d1d;
      font-size: 13px;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--sand); border-radius: 3px; }
  </style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <header>
    <div class="logo">Bon <span>Voyage</span></div>
    <div class="tagline">AI-Powered Trip Planner</div>
  </header>

  <!-- Left Panel -->
  <aside class="panel-left">
    <div class="panel-heading">
      <h2>Plan your<br/>next adventure</h2>
      <p>Describe your dream trip — destination, dates, budget, and interests.</p>
    </div>

    <div class="examples">
      <div class="examples-label">Quick Examples</div>
      <button class="example-chip" onclick="setExample(this)">5 days in Tokyo, $200/day, first-time visitor, love food and pop culture</button>
      <button class="example-chip" onclick="setExample(this)">3 days in Paris starting June 10 2025, $150/day, art lover, solo traveler</button>
      <button class="example-chip" onclick="setExample(this)">1 week in Bali, $100/day, couple, interested in temples, beaches, and wellness</button>
      <button class="example-chip" onclick="setExample(this)">4 days in NYC, $250/day, with kids aged 8 and 11, first time visiting</button>
    </div>

    <div class="activity-log" id="activityLog">
      <div class="activity-log-label">Agent Activity</div>
      <div id="logEntries"></div>
    </div>

    <div class="input-area">
      <label>Your trip request</label>
      <textarea id="tripInput" placeholder="E.g. '5 days in Kyoto in April, $180/day, obsessed with zen gardens and street food...'" rows="5"></textarea>
      <button class="btn-plan" id="planBtn" onclick="planTrip()">Plan My Trip →</button>
    </div>
  </aside>

  <!-- Right Panel -->
  <main class="panel-right" id="mainPanel">
    <div class="empty-state" id="emptyState">
      <div class="empty-state-icon">🗺️</div>
      <h3>Where to next?</h3>
      <p>Describe your trip on the left and I'll craft a bespoke itinerary using live web search and weather data.</p>
    </div>
  </main>

</div>

<script>
  function setExample(btn) {
    document.getElementById('tripInput').value = btn.textContent.trim();
  }

  function addLog(type, text) {
    const entries = document.getElementById('logEntries');
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `<div class="log-dot ${type}"></div><div class="log-text">${text}</div>`;
    entries.appendChild(entry);
    entries.parentElement.scrollTop = entries.parentElement.scrollHeight;
  }

  function clearLog() {
    document.getElementById('logEntries').innerHTML = '';
  }

  const TOOL_LABELS = {
    search_web: '🔍 search_web',
    get_weather_forecast: '🌤 weather',
    get_place_details: '📍 place_details',
    estimate_travel_costs: '💰 cost_estimate',
  };

  function toolLabel(name) {
    return TOOL_LABELS[name] || name;
  }

  async function planTrip() {
    const input = document.getElementById('tripInput').value.trim();
    if (!input) return;

    const btn = document.getElementById('planBtn');
    btn.disabled = true;
    btn.textContent = 'Planning…';

    clearLog();
    addLog('info', 'Starting trip planner agent…');

    const panel = document.getElementById('mainPanel');
    document.getElementById('emptyState')?.remove();
    panel.innerHTML = `<div class="spinner-wrap"><div class="spinner"></div><div class="spinner-label">Researching your trip…</div></div>`;

    try {
      const resp = await fetch('/api/plan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: input }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = JSON.parse(line.slice(6));
          handleEvent(data, input);
        }
      }
    } catch (err) {
      panel.innerHTML = `<div class="error-banner">⚠️ ${err.message}</div>`;
      addLog('error', 'Request failed: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Plan My Trip →';
    }
  }

  function handleEvent(data, userRequest) {
    const panel = document.getElementById('mainPanel');

    if (data.type === 'tool_call') {
      addLog('calling', `<span class="tool-badge">${toolLabel(data.tool)}</span> ${JSON.stringify(data.input).slice(0, 80)}…`);
    }

    if (data.type === 'tool_result') {
      const icon = data.success ? '✓' : '✗';
      addLog(data.success ? 'done' : 'error', `${icon} ${toolLabel(data.tool)} returned`);
    }

    if (data.type === 'complete') {
      addLog('done', `✓ Itinerary complete — ${data.iterations} LLM turns, ${data.tool_calls.length} tool calls`);
      renderItinerary(data.itinerary, data.tool_calls, userRequest, panel);
    }

    if (data.type === 'error') {
      addLog('error', '✗ Error: ' + data.message);
      panel.innerHTML = `<div class="error-banner">⚠️ ${data.message}</div>`;
    }
  }

  function renderItinerary(text, toolCalls, userRequest, panel) {
    // Parse some metadata from the request string
    const dayMatch = userRequest.match(/(\d+)\s*day/i);
    const budgetMatch = userRequest.match(/\$\s*([\d,]+)/);
    const numDays = dayMatch ? dayMatch[1] : '?';
    const budget = budgetMatch ? '$' + budgetMatch[1] + '/day' : 'See below';

    const html = markdownToHtml(text);

    panel.innerHTML = `
      <div class="itinerary">
        <div class="itinerary-meta">${new Date().toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'})} &nbsp;·&nbsp; Generated by AI Travel Agent</div>
        <div class="stats-strip">
          <div class="stat"><div class="stat-value">${numDays}</div><div class="stat-label">Days</div></div>
          <div class="stat"><div class="stat-value">${budget}</div><div class="stat-label">Budget</div></div>
          <div class="stat"><div class="stat-value">${toolCalls.length}</div><div class="stat-label">Sources Checked</div></div>
          <div class="stat"><div class="stat-value">${toolCalls.filter(t=>t.tool==='search_web').length}</div><div class="stat-label">Web Searches</div></div>
        </div>
        <div class="itinerary-body">${html}</div>
      </div>`;
  }

  // Lightweight Markdown → HTML converter
  function markdownToHtml(md) {
    return md
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h2>$1</h2>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/^- (.+)$/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
      .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
      .replace(/\n{2,}/g, '</p><p>')
      .replace(/^(?!<[hul])(.+)$/gm, '$1')
      .replace(/^<\/p><p>(<h[234])/gm, '$1')
      .replace(/(<h[234][^>]*>.*<\/h[234]>)<\/p><p>/g, '$1')
  }

  // Keyboard shortcut
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') planTrip();
  });
</script>

</body>
</html>
